# docker compose up -d   -> bot + dashboard (dashboard on 127.0.0.1:8501 only).
services:
  bot:
    build: .
    image: ai-trader:latest
    restart: always
    env_file: .env            # secrets: never baked into the image
    volumes:
      - trader-data:/app/data # SQLite DB, candle cache, backtests (back this up: DEPLOY.md §10)
      - ./config:/app/config:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  dashboard:
    image: ai-trader:latest
    restart: always
    depends_on: [bot]
    # No env_file: the dashboard only reads the database and needs no secrets.
    environment:
      DATABASE_URL: sqlite:///data/trader.db
    command:
      - streamlit
      - run
      - /app/src/ai_trader/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"   # localhost only: use an SSH tunnel, never expose it
    volumes:
      - trader-data:/app/data
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# A Docker-managed volume, not a host folder: SQLite needs working file locks, which
# network drives (NFS/SMB home directories), Docker Desktop file sharing and some
# rootless setups don't provide ("disk I/O error"). A new volume also starts owned by
# the container's user, so no chown is needed. `docker compose down` keeps it;
# only `docker compose down -v` deletes it.
volumes:
  trader-data:
