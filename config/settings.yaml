# Trading configuration. Risk limits live here and in code — never in the LLM prompt.
pairs: ["BTC/CAD", "ETH/CAD"]         # spot whitelist; quote must match quote_currency
quote_currency: CAD
decision_interval_minutes: 240        # start slow: every 4h
max_data_age_seconds: 60

paper:
  starting_cash_cad: 10000
  # UNVERIFIED — Kraken's spot fee tier is only readable with an authenticated key.
  # Kraken's Sept 2026 support page says spot taker fees go "up to 0.80%" (earlier
  # 2026 versions said 0.40%). Using the higher figure so paper results err on the side
  # of too costly. Set to your real tier once known (Kraken API: TradeVolume).
  taker_fee_pct: 0.80
  maker_fee_pct: 0.40

risk:
  max_trade_pct_of_equity: 10
  max_position_pct_per_pair: 30
  max_total_exposure_pct: 60
  daily_loss_limit_pct: 3             # halt trading for the day
  max_drawdown_halt_pct: 15           # halt until manual /resume
  min_minutes_between_trades: 60
  min_confidence: 0.6
  max_trades_per_day: 6
  default_stop_loss_pct: 5

llm:
  timeout_seconds: 120
  max_tokens: 4000                    # litellm only; reasoning models count thinking tokens
  max_daily_calls: 12                 # per account; 6 scheduled + room for manual runs
  max_daily_cost_usd: 2.00            # per account (claude_code: API-equivalent estimate)

models:                               # each gets its own paper account (paper-<name>)
  # provider claude_code runs `claude -p` on your Claude Team seat (no per-token bill).
  # Needs the Claude Code CLI installed and CLAUDE_CODE_OAUTH_TOKEN in .env.
  # provider litellm calls an API directly, e.g. model: "anthropic/claude-opus-5-5"
  # with ANTHROPIC_API_KEY (optional per-model: temperature, max_tokens, api_base).
  - name: claude
    provider: claude_code
    model: "claude-opus-5-5"

benchmarks: [buy_and_hold, ma_crossover, do_nothing]
